name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci --no-audit --no-fund

      - name: Typecheck e test unitari
        run: npm run check

      - name: Build di produzione
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
